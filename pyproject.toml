[project]
name = "bootstart-trial"
version = "0.1.0"
description = "Command-line tool that converts temperatures between Celsius, Fahrenheit and Kelvin."
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
bootstart-trial = "bootstart_trial.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bootstart_trial"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rule reference: https://docs.astral.sh/ruff/rules/
select = [
  "E", "W", # pycodestyle
  "F",      # pyflakes
  "I",      # import order
  "N",      # PEP 8 naming
  "B",      # likely bugs
  "UP",     # modern syntax
  "SIM",    # simplifications
  "C4",     # comprehensions
  "RET",    # return statements
  "ARG",    # unused arguments
  "PT",     # pytest style
  "PL",     # pylint subset (complexity, magic values)
  "S",      # security
  "RUF",    # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Plain asserts and literal values are the point of tests.
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib",
  "--strict-markers",
  "--cov=bootstart_trial",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
