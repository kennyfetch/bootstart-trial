name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs: one group per branch, so a new push cancels the superseded run.
  # Pushes to main: one group per commit, so no run waits behind or replaces another and every
  # commit keeps its own result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # This job name is the required status check set by scripts/setup-github.sh.
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fail on a stale uv.lock instead of silently updating it.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Set up uv (Python)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: just setup
      - run: just check
